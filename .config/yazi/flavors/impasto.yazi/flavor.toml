# GENERATED by scripts/theme_manager.py on every palette change.
# Read by yazi as `[flavor] dark = "impasto"`; edits here are lost at
# the next theme switch, and yazi has to be reopened to see it.
#
# Backgrounds are set only where something has to sit on one, so the
# blurred desktop under the terminal comes through everywhere else.

[mgr]
cwd = { fg = "#89b4fa", bold = true }

find_keyword = { fg = "#f9e2af", bold = true, underline = true }
find_position = { fg = "#5b6378", bold = true, italic = true }
symlink_target = { fg = "#d5d8e5", italic = true }

marker_copied = { fg = "#a6e3a1", bg = "#a6e3a1" }
marker_cut = { fg = "#f38ba8", bg = "#f38ba8" }
marker_marked = { fg = "#5874a2", bg = "#5874a2" }
marker_selected = { fg = "#89b4fa", bg = "#89b4fa" }

count_copied = { fg = "#1e2737", bg = "#a6e3a1" }
count_cut = { fg = "#1e2737", bg = "#f38ba8" }
count_selected = { fg = "#11111b", bg = "#89b4fa" }

border_symbol = "│"
border_style = { fg = "#33384a" }

# The cursor, in both panes: the ground lifted, and towards the accent
# where the cursor actually is.
[indicator]
current = { bg = "#485f85" }
parent = { bg = "#2a3344" }
preview = { underline = true }

[tabs]
active = { fg = "#cdd6f4", bg = "#363f51", bold = true }
inactive = { fg = "#a6adc8", bg = "#2a3344" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#cdd6f4", bg = "#363f51", bold = true }
normal_alt = { fg = "#a6adc8", bg = "#2a3344" }

select_main = { fg = "#11111b", bg = "#89b4fa", bold = true }
select_alt = { fg = "#89b4fa", bg = "#485f85" }

unset_main = { fg = "#1e2737", bg = "#f9e2af", bold = true }
unset_alt = { fg = "#f9e2af", bg = "#757167" }

[status]
overall = { fg = "#cdd6f4" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_sep = { fg = "#5b6378" }
perm_type = { fg = "#89b4fa" }
perm_read = { fg = "#f9e2af" }
perm_write = { fg = "#f38ba8" }
perm_exec = { fg = "#a6e3a1" }

progress_label = { fg = "#d1d9f4", bold = true }
progress_normal = { fg = "#89b4fa", bg = "#485f85" }
progress_error = { fg = "#1e2737", bg = "#f38ba8" }

[which]
border = { fg = "#33384a" }
cols = 3
mask = { bg = "#2a3344" }
cand = { fg = "#89b4fa", bold = true }
rest = { fg = "#a6adc8" }
desc = { fg = "#5b6378", italic = true }
separator_style = { fg = "#33384a" }

[confirm]
border = { fg = "#33384a" }
title = { fg = "#89b4fa", bold = true }
body = { fg = "#cdd6f4" }
list = { fg = "#a6adc8" }
btn_yes = { fg = "#11111b", bg = "#89b4fa", bold = true }
btn_no = { fg = "#a6adc8", bg = "#2a3344" }

[spot]
border = { fg = "#33384a" }
title = { fg = "#89b4fa", bold = true }
tbl_col = { fg = "#a6adc8" }
tbl_cell = { bg = "#2a3344" }

[notify]
title_info = { fg = "#89b4fa" }
title_warn = { fg = "#f9e2af" }
title_error = { fg = "#f38ba8" }

[pick]
border = { fg = "#33384a" }
active = { fg = "#89b4fa", bold = true }
inactive = { fg = "#a6adc8" }

[input]
border = { fg = "#33384a" }
title = { fg = "#89b4fa", bold = true }
value = { fg = "#cdd6f4" }
selected = { bg = "#2a3344" }

[cmp]
border = { fg = "#33384a" }
active = { fg = "#cdd6f4", bg = "#2a3344" }
inactive = { fg = "#a6adc8" }

[tasks]
border = { fg = "#33384a" }
title = { fg = "#89b4fa", bold = true }
hovered = { fg = "#89b4fa", bold = true }

[help]
border = { fg = "#33384a" }
chord = { fg = "#89b4fa" }
action = { fg = "#cdd6f4" }
hovered = { bg = "#2a3344", bold = true }

# The mime patterns are yazi's own shape — `**/` and a brace list — and
# not the bare `image/*` an older flavour would use, which matches
# nothing here and says nothing about it.
[filetype]
rules = [
  { mime = "**/image/*", fg = "#d2d8fe" },
  { mime = "**/{audio,video}/*", fg = "#f9e2af" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#fad0db" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#c3d9fc" },

  { mime = "vfs/{absent,stale}", fg = "#5b6378", crossed = true },
  { url = "*", is = "orphan", fg = "#5b6378", crossed = true },
  { url = "*", is = "dummy", fg = "#5b6378", crossed = true },
  { url = "*/", is = "dummy", fg = "#5b6378", crossed = true },
  { url = "*", is = "exec", fg = "#b1e6ac" },

  { url = "*", fg = "#d5d8e5" },
  { url = "*/", fg = "#d1d9f4" }
]
